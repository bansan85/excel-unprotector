[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-unprotector"
version = "0.0.1"
description = "Tool for unprotecting XLSX files through XML and binary manipulation"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Vincent Le Garrec", email = "github@le-garrec.fr" }]
keywords = ["excel", "xlsx", "xml", "unprotect", "vba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/bansan85/excel-unprotector"

[project.scripts]
excel-unprotector = "excel_unprotector.cli:main"

[tool.setuptools]
packages = ["excel_unprotector"]
